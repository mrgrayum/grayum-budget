<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Grayum Budget</title>
<meta name="theme-color" content="#0d2440">
<style>
  :root{
    --navy:#0d2440; --navy2:#123058; --ink:#14202e; --muted:#68788a;
    --green:#1f9d63; --green-d:#157347; --green-soft:#e5f5ec;
    --red:#d92d20; --red-soft:#fdecea;
    --line:#dde4ec; --bg:#f2f5f8; --card:#ffffff;
    --radius:14px;
    --shadow:0 1px 3px rgba(13,36,64,.10), 0 4px 14px rgba(13,36,64,.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  /* The page must never scroll sideways: `clip` (with `hidden` as the
     fallback for older engines) guards against any stray wide element. */
  html,body{overflow-x:hidden; overflow-x:clip;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg); color:var(--ink); font-size:15px; line-height:1.4;}
  button{font:inherit; cursor:pointer;}
  input,select,textarea{font:inherit;}
  .hidden{display:none !important;}

  /* ---------- auth ---------- */
  .auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    background:linear-gradient(160deg, var(--navy) 0%, var(--navy2) 60%, #17573a 130%);}
  .auth-card{background:#fff; border-radius:18px; padding:28px 24px; max-width:380px; width:100%; box-shadow:var(--shadow);}
  .auth-card h1{margin:0 0 4px; font-size:24px; color:var(--navy);}
  .auth-card p.sub{margin:0 0 18px; color:var(--muted); font-size:14px;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:10px;
    padding:11px 16px; font-weight:600; background:var(--green); color:#fff; width:100%;}
  .btn:hover{background:var(--green-d);}
  .btn.secondary{background:#eef2f6; color:var(--navy);}
  .btn.secondary:hover{background:#e0e7ef;}
  .btn.danger{background:var(--red);}
  .btn.small{width:auto; padding:7px 12px; font-size:13px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .auth-card .divider{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; margin:16px 0;}
  .auth-card .divider::before,.auth-card .divider::after{content:""; flex:1; border-top:1px solid var(--line);}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--navy); margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%; padding:10px 11px; border:1.5px solid var(--line);
    border-radius:10px; background:#fff; color:var(--ink);}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--green);}
  .field .hint{font-size:12px; color:var(--muted); margin-top:4px;}
  /* Backup file picker: a real, visible input (NOT display:none) so people and
     browser file-upload tooling can target it directly. */
  .filepick{margin-top:8px;}
  .filepick input[type="file"]{display:block; width:100%; font-size:13px; color:var(--muted);}
  .filepick input[type="file"]::file-selector-button{font:inherit; font-weight:600; cursor:pointer;
    border:none; border-radius:9px; padding:8px 12px; margin-right:10px; background:var(--navy); color:#fff;}
  .filepick input[type="file"]::file-selector-button:hover{background:var(--navy2);}
  .notice{background:#fff7e6; border:1px solid #f0d48a; color:#6b5310; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:14px;}

  /* ---------- app frame ---------- */
  header.topbar{background:linear-gradient(150deg, var(--navy), var(--navy2)); color:#fff;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px)); position:sticky; top:0; z-index:30;}
  .topbar .row{display:flex; align-items:center; justify-content:space-between; gap:10px; max-width:980px; margin:0 auto;}
  .topbar .brand{font-weight:700; font-size:15px; letter-spacing:.2px; opacity:.92;}
  .topbar .who{font-size:12px; opacity:.75;}
  .monthnav{display:flex; align-items:center; gap:6px;}
  .monthnav button{background:rgba(255,255,255,.14); color:#fff; border:none; border-radius:9px; width:34px; height:34px; font-size:16px;}
  .monthnav button:hover{background:rgba(255,255,255,.25);}
  .monthnav select{background:rgba(255,255,255,.14); color:#fff; border:none; border-radius:9px; padding:8px 6px; font-weight:700; font-size:16px;}
  .monthnav select option{color:var(--ink);}
  .ltb{text-align:right;}
  .ltb .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.8px; opacity:.75;}
  .ltb .val{font-size:22px; font-weight:800; line-height:1.1;}
  .overbar{background:var(--red); color:#fff; font-weight:700; text-align:center; padding:7px 10px; font-size:14px;}
  .closedbar{background:#5b6b7d; color:#fff; font-weight:600; text-align:center; padding:6px 10px; font-size:13px;}

  /* ---------- narrow screens (phones, ≤480px) ----------
     Header stacks: title + Left to Budget share the first row, the month
     navigation wraps to its own full-width row — nothing is clipped and
     the page cannot overflow sideways. (Phone sizing for the account
     boxes lives at the END of this stylesheet: the base .acctbox rules
     sit below this block, so overrides placed here would lose the
     cascade and never apply.) */
  @media(max-width:480px){
    header.topbar{padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));}
    .topbar .row{flex-wrap:wrap; gap:8px 10px;}
    .topbar .brand{font-size:14.5px;}
    .topbar .who{font-size:11px;}
    .ltb .lbl{font-size:10px;}
    .ltb .val{font-size:20px;}
    .monthnav{order:3; flex:1 1 100%; justify-content:space-between; gap:8px;}
    .monthnav button{width:38px; height:36px; flex:0 0 auto;}
    .monthnav select{flex:1; min-width:0; text-align:center; padding:8px 4px;}
  }

  main{max-width:980px; margin:0 auto; padding:14px 12px 110px;}
  @media(min-width:760px){ main{padding-bottom:30px;} }

  nav.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:#fff; border-top:1px solid var(--line);
    display:flex; padding-bottom:env(safe-area-inset-bottom,0px);}
  nav.tabbar button{flex:1; background:none; border:none; padding:9px 2px 7px; font-size:11px; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:2px;}
  nav.tabbar button .ic{font-size:19px; line-height:1;}
  nav.tabbar button.active{color:var(--green-d); font-weight:700;}
  @media(min-width:760px){
    nav.tabbar{position:sticky; top:0; bottom:auto; border-top:none; border-bottom:1px solid var(--line); justify-content:center;}
    nav.tabbar button{flex:0 0 auto; padding:10px 22px; flex-direction:row; font-size:13.5px;}
  }

  /* ---------- cards & panels ---------- */
  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; margin-bottom:12px;}
  .card h3{margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.7px; color:var(--navy);}
  /* Account boxes: equal-width grid columns at every viewport size — all
     boxes are always fully visible; the row never scrolls sideways. */
  .acctrow{display:grid; grid-template-columns:repeat(auto-fit,minmax(0,1fr)); gap:10px;}
  .acctbox{min-width:0; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:10px 12px; cursor:pointer; border-top:4px solid var(--green);}
  .acctbox .nm{font-size:11.5px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:.4px;}
  .acctbox .bl{font-size:19px; font-weight:800; margin:2px 0; white-space:nowrap;}
  .acctbox .cl{font-size:11.5px; color:var(--muted);}
  .kv{display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed var(--line);}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--muted);} .kv .v{font-weight:700;}
  /* Total Available Dollars panels: tighter rows so the whole panel stays
     short, especially on a phone. */
  .card.tad{padding:10px 12px;}
  .card.tad h3{margin-bottom:4px;}
  .card.tad .kv{padding:3px 0; font-size:14px;}
  .kv .v.neg{color:var(--red);}
  .muted{color:var(--muted);} .small{font-size:12.5px;}
  .pos{color:var(--green-d); font-weight:700;} .neg{color:var(--red); font-weight:700;}
  .overflag{color:var(--red); font-weight:800;}

  /* ---------- budget lines ---------- */
  .grouphead{display:flex; justify-content:space-between; align-items:baseline; margin:18px 2px 8px;}
  .grouphead .gn{font-size:16px; font-weight:800; color:var(--navy);}
  .grouphead .gt{font-size:12.5px; color:var(--muted); font-weight:600;}
  .line-card{background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:11px 13px; margin-bottom:9px;}
  .line-top{display:flex; align-items:flex-start; gap:8px;}
  .line-name{font-weight:700; font-size:15px; flex:1; cursor:pointer;}
  .line-name .due{display:block; font-size:11.5px; color:var(--muted); font-weight:500;}
  .line-name .due.soon{color:var(--red); font-weight:700;}
  .star{background:none; border:none; font-size:17px; color:#c3cedb; padding:2px;}
  .star.on{color:var(--green);}
  .mvbtn{background:var(--green-soft); color:var(--green-d); border:none; border-radius:8px; width:30px; height:30px; font-size:15px; font-weight:700;}
  .line-nums{display:flex; gap:6px; margin-top:8px;}
  .line-nums .cell{flex:1; background:#f6f9fb; border-radius:9px; padding:6px 8px; text-align:center;}
  .line-nums .cell .l{font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted);}
  .line-nums .cell .n{font-size:14.5px; font-weight:700;}
  .line-nums .cell .n.neg{color:var(--red);}
  .line-nums .cell.avail{background:var(--green-soft);}
  .planned-edit{width:100%; border:none; background:transparent; text-align:center; font-weight:700; font-size:14.5px; padding:0; color:var(--ink);}
  .planned-edit:focus{outline:none;}
  .progress{height:5px; background:#e7edf3; border-radius:3px; margin-top:9px; overflow:hidden;}
  .progress > div{height:100%; background:var(--green); border-radius:3px;}
  .progress > div.over{background:var(--red);}
  .addrow{display:flex; gap:8px; margin:6px 0 2px;}
  .addrow .btn{flex:1;}

  /* ---------- lists ---------- */
  .txnrow{display:flex; gap:10px; align-items:flex-start; background:#fff; border-radius:12px; box-shadow:var(--shadow);
    padding:10px 12px; margin-bottom:8px; cursor:pointer;}
  .txnrow .main{flex:1; min-width:0;}
  .txnrow .merch{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .txnrow .meta{font-size:12px; color:var(--muted);}
  .txnrow .amt{font-weight:800; white-space:nowrap;}
  .clr{flex:0 0 auto; height:24px; padding:0 10px; border-radius:999px; border:2px solid var(--line); background:#fff;
    color:var(--green-d); font-size:11.5px; font-weight:700; line-height:1; display:flex; align-items:center; justify-content:center; white-space:nowrap;}
  .clr.on{background:var(--green); border-color:var(--green); color:#fff;}
  .pill{display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; background:#eef2f6; color:var(--navy);}
  .pill.green{background:var(--green-soft); color:var(--green-d);}
  .pill.red{background:var(--red-soft); color:var(--red);}
  .pill.gray{background:#eef2f6; color:var(--muted);}
  .searchbar{width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:11px; margin-bottom:12px; background:#fff;}
  .searchbar:focus{outline:none; border-color:var(--green);}

  /* ---------- modal ---------- */
  .modal-bg{position:fixed; inset:0; background:rgba(10,22,38,.55); z-index:50; display:flex; align-items:flex-end; justify-content:center; overscroll-behavior:contain;}
  @media(min-width:760px){ .modal-bg{align-items:center;} }
  .modal{background:#fff; width:100%; max-width:560px; max-height:92vh; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; border-radius:18px 18px 0 0; padding:18px;}
  /* Scroll lock while a modal is open (see lockBodyScroll): the body is
     frozen at its current offset (JS sets top:-<scrollY>px) so swipes land
     on the modal sheet, never the page behind it — the reliable iOS fix. */
  body.scroll-locked{position:fixed; left:0; right:0; width:100%; overflow:hidden;}
  @media(min-width:760px){ .modal{border-radius:18px;} }
  .modal h2{margin:0 0 14px; font-size:18px; color:var(--navy);}
  .modal .actions{display:flex; gap:8px; margin-top:14px;}
  .modal .actions .btn{flex:1;}
  .seg{display:flex; background:#eef2f6; border-radius:10px; padding:3px; margin-bottom:12px;}
  .seg button{flex:1; border:none; background:none; padding:8px; border-radius:8px; font-weight:600; color:var(--muted);}
  .seg button.on{background:#fff; color:var(--navy); box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .splitrow{display:flex; gap:8px; margin-bottom:8px; align-items:center;}
  .splitrow select{flex:1.4;} .splitrow input{flex:1;}
  .splitrow .rm{flex:0 0 auto; width:32px; height:38px;}
  .checkrow{display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px dashed var(--line);}
  .checkrow:last-child{border-bottom:none;}
  .checkrow .st{font-size:17px;}

  .fab{position:fixed; right:16px; bottom:86px; z-index:40; width:56px; height:56px; border-radius:50%;
    background:var(--green); color:#fff; border:none; font-size:27px; box-shadow:0 6px 18px rgba(21,115,71,.4);}
  @media(min-width:760px){ .fab{bottom:26px;} }
  .empty{color:var(--muted); text-align:center; padding:26px 10px;}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:96px; z-index:60; background:var(--navy); color:#fff;
    padding:10px 16px; border-radius:10px; font-size:13.5px; box-shadow:var(--shadow); max-width:92vw; text-align:center;}
  /* Phone tightening for the account boxes — deliberately placed after the
     base component rules so these declarations win the cascade at ≤480px:
     at 390px wide, three boxes sit side by side (≈117px each) with the full
     balance and "Cleared $X" caption visible, no sideways scrolling. */
  @media(max-width:480px){
    .acctrow{gap:8px;}
    .acctbox{padding:9px 8px;}
    .acctbox .nm{font-size:10.5px; letter-spacing:.2px;}
    .acctbox .bl{font-size:16px;}
    .acctbox .cl{font-size:10.5px;}
  }
  @media print{
    nav.tabbar, header.topbar .who, .fab, .mvbtn, .star, .addrow, .no-print{display:none !important;}
    body{background:#fff;} main{padding:0;}
  }
</style>
</head>
<body>

<!-- ======================= AUTH ======================= -->
<div id="view-auth" class="auth-wrap hidden">
  <div class="auth-card">
    <h1>Grayum Budget</h1>
    <p class="sub">Our household budget — invite only.</p>
    <div id="auth-notice" class="notice hidden"></div>
    <button id="btn-google" class="btn">Continue with Google</button>
    <div class="divider">or</div>
    <div class="field">
      <label for="auth-email">Email me a sign-in link</label>
      <input id="auth-email" type="email" autocomplete="email" placeholder="you@example.com">
    </div>
    <button id="btn-emaillink" class="btn secondary">Send sign-in link</button>
    <p id="auth-msg" class="small muted" style="margin-top:12px;"></p>
  </div>
</div>

<!-- ======================= DENIED ======================= -->
<div id="view-denied" class="auth-wrap hidden">
  <div class="auth-card">
    <h1>Invite only</h1>
    <p class="sub">Accounts are by invite only. This budget is private to the Grayum household —
      the account you signed in with isn't on the invite list.</p>
    <button id="btn-denied-signout" class="btn secondary">Sign out</button>
  </div>
</div>

<!-- ======================= APP ======================= -->
<div id="view-app" class="hidden">
  <header class="topbar">
    <div class="row">
      <div>
        <div class="brand">Grayum Budget</div>
        <div class="who" id="who-line"></div>
      </div>
      <div class="monthnav" id="monthnav">
        <button id="m-prev" title="Previous month">‹</button>
        <select id="m-select"></select>
        <button id="m-next" title="Next month">›</button>
      </div>
      <div class="ltb" id="ltb-box">
        <div class="lbl">Left to Budget</div>
        <div class="val" id="ltb-val">$0.00</div>
      </div>
    </div>
  </header>
  <div id="overbar" class="overbar hidden"></div>
  <div id="closedbar" class="closedbar hidden"></div>

  <nav class="tabbar" id="tabbar">
    <button data-tab="budget" class="active"><span class="ic">▦</span>Budget</button>
    <button data-tab="activity"><span class="ic">☰</span>Activity</button>
    <button data-tab="review"><span class="ic">✓</span>Review</button>
    <button data-tab="accounts"><span class="ic">▤</span>Accounts</button>
    <button data-tab="more"><span class="ic">•••</span>More</button>
  </nav>

  <main id="main"></main>
  <button id="fab" class="fab hidden" title="Add transaction">+</button>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
"use strict";
/* =====================================================================
   Grayum Budget — hosted edition
   Single shared household budget in Firestore. All money is integer
   cents. Formulas mirror check_seed.py exactly (baseline-verified).
   ===================================================================== */

const APP_VERSION = "2026-11-05 · archived-list";

/* ---------------- helpers ---------------- */
const $ = (sel, el) => (el || document).querySelector(sel);
const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function fmt(c) {
  const neg = c < 0, a = Math.abs(c);
  return (neg ? "-$" : "$") + Math.floor(a / 100).toLocaleString("en-US") + "." + String(a % 100).padStart(2, "0");
}
function fmtPlain(c) { // no $ sign, for inputs
  const neg = c < 0, a = Math.abs(c);
  return (neg ? "-" : "") + Math.floor(a / 100).toLocaleString("en-US") + "." + String(a % 100).padStart(2, "0");
}
function fmtSigned(c) { // Difference displays only: +$53.00 / −$53.00 / $0.00 — sign is the meaning
  if (c === 0) return fmt(0);
  const a = Math.abs(c);
  return (c > 0 ? "+$" : "−$") + Math.floor(a / 100).toLocaleString("en-US") + "." + String(a % 100).padStart(2, "0");
}
function diffCls(d) { // Difference = accounts − budget: positive is unassigned money (fine), negative is the alarm
  return d < 0 ? "neg" : "pos";
}
function diffBanner(d) { // one-line verdict under the Difference row in the Total Available Dollars panel
  if (d === 0) return `<div class="small pos" style="margin-top:4px;">✓ Budgeted to the dollar — your accounts and budget agree.</div>`;
  if (d > 0) return `<div class="small pos" style="margin-top:4px;">${fmtSigned(d)} in your accounts isn't assigned to a budget item yet.</div>`;
  return `<div class="small neg" style="margin-top:4px;">Your budget assigns ${fmt(-d)} more than your accounts hold.</div>`;
}
function unassignedLine(d) { // home-panel flag for money that bypassed the budget:
  // a nonzero accounts-vs-budget difference means dollars sitting in accounts
  // that live in NO item's Available (positive) or items claiming dollars the
  // accounts don't hold (negative). Zero renders nothing.
  if (d === 0) return "";
  if (d > 0) return `<div class="small pos" style="margin-top:4px;">${fmtSigned(d)} in your accounts isn't in any budget item yet — it needs a plan.</div>`;
  return `<div class="small neg" style="margin-top:4px;">Your budget items claim ${fmt(-d)} more than your accounts hold.</div>`;
}
function planDiffBanner(ltb) { // home panel verdict: the Difference row IS the planning comparison
  // (expected income this month − planned into items). Under-planned is
  // positive news — money still available to plan; over-planned is red.
  if (ltb > 0) return `<div class="small pos" style="margin-top:4px;">Money available to plan — add it to a line item.</div>`;
  if (ltb < 0) return `<div class="small neg" style="margin-top:4px;">Planned ${fmt(-ltb)} more than expected income this month.</div>`;
  return `<div class="small pos" style="margin-top:4px;">Planned to the dollar — all expected income is planned into items.</div>`;
}
function planVerdict(flows) { // Matt's two plan checks, as compact verdict lines in the Total Available Dollars panel
  // PLANNING (his rule): whatever is put into Planned this month can only
  // equal the income expected this month — total put-ins into non-income
  // items vs total expected income (= Left to Budget for the month).
  // Three states, all shown in this panel: under-planned is POSITIVE
  // (expected income not yet put into items), exactly equal balances,
  // over-planned is red. Planned amounts are checked against expected
  // income itself — stray unassigned cash in the accounts does NOT
  // excuse planning beyond it.
  // COVERAGE: everything assigned across items (their Available totals)
  // must be backed by money on hand plus income still coming in — the
  // Account Balancer's shortfall (Assigned − Held − Expected-not-yet-
  // received, floored at 0). Both checks anchor to the ACTIVE month.
  const t = monthTotals(activeMonth(), flows);
  const b = balancer(flows);
  const ltb = t.incPlanned - t.outPlanned; // Left to Budget, active month
  const cov = `Assigned ${fmt(b.assigned)} · ${fmt(b.held)} on hand + ${fmt(b.expected)} still coming in`;
  let plan;
  if (ltb > 0) plan = `<div class="small pos" style="margin-top:4px;">You still have ${fmt(ltb)} to plan — expected income not yet put into items.</div>`;
  else if (ltb === 0) plan = `<div class="small pos" style="margin-top:4px;">Plan balances — put-ins equal expected income this month.</div>`;
  else plan = `<div class="small neg" style="margin-top:4px;">Over budget — ${fmt(-ltb)} more planned into items than the ${fmt(t.incPlanned)} expected this month.</div>`;
  const covLine = b.over > 0
    ? `<div class="small neg" style="margin-top:4px;">${cov} (${fmt(b.over)} too much)</div>`
    : `<div class="small muted" style="margin-top:4px;">${cov}</div>`;
  return plan + covLine;
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function monthOf(dateStr) { return (dateStr || "").slice(0, 7); }
function monthLabel(m) {
  const [y, mo] = m.split("-").map(Number);
  return new Date(y, mo - 1, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
}
function addMonths(m, n) {
  const [y, mo] = m.split("-").map(Number);
  const d = new Date(y, mo - 1 + n, 1);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}
function addDays(dateStr, n) {
  const [y, mo, da] = dateStr.split("-").map(Number);
  const d = new Date(y, mo - 1, da + n);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  $("#toast-root").appendChild(t);
  setTimeout(() => t.remove(), 3400);
}
function download(filename, text, type) {
  const blob = new Blob([text], { type: type || "application/octet-stream" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------------- money input (cents-first) ----------------
   Typing digits builds the amount in cents: 1 2 3 4 -> $12.34.
   Typing "." switches to explicit-dollar entry: the digits typed so
   far become whole dollars and following digits are decimal cents.
----------------------------------------------------------- */
function attachMoneyInput(input, initialCents, opts) {
  // opts.dollar: include the "$" in the rendered value (used by the Planned
  // cell so it matches the $ shown on the other cells). Display-only — the
  // buffers, key handling, and cents-first entry are identical either way.
  const showDollar = !!(opts && opts.dollar);
  let mode = "cents";                 // 'cents' | 'dollars'
  let digits = String(Math.abs(initialCents || 0)); // cents-mode buffer
  let dollarText = "";                // dollars-mode buffer (e.g. "1234.5")
  function render() {
    if (mode === "cents") {
      input.value = digits === "" ? "" : (showDollar ? fmt(parseInt(digits, 10) || 0) : fmtPlain(parseInt(digits, 10) || 0));
    } else {
      const parts = dollarText.split(".");
      const intPart = parts[0] === "" ? "" : Number(parts[0]).toLocaleString("en-US");
      input.value = (showDollar ? "$" : "") + (parts.length > 1 ? intPart + "." + parts[1] : intPart + ".");
    }
    input.setSelectionRange(input.value.length, input.value.length);
  }
  input.addEventListener("focus", () => { render(); });
  input.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (/^[0-9]$/.test(k)) {
      e.preventDefault();
      if (mode === "cents") {
        digits = (digits + k).replace(/^0+(?=\d)/, "");
        if (digits.length > 11) digits = digits.slice(0, 11);
      } else {
        const dec = dollarText.split(".")[1] || "";
        if (dec.length >= 2) return;
        dollarText += k;
      }
      render();
    } else if (k === ".") {
      e.preventDefault();
      if (mode === "cents") {
        mode = "dollars";
        dollarText = String(Math.floor((parseInt(digits, 10) || 0) / 100)) + ".";
        render();
      }
    } else if (k === "Backspace" || k === "Delete") {
      e.preventDefault();
      if (mode === "cents") {
        digits = digits.slice(0, -1);
      } else {
        dollarText = dollarText.slice(0, -1);
        if (!dollarText.includes(".")) { // fell back through the dot: return to cents mode
          mode = "cents";
          digits = String(Math.round(parseFloat(dollarText || "0") * 100));
          dollarText = "";
        }
      }
      render();
    } else if (["Tab", "Enter", "ArrowLeft", "ArrowRight", "Home", "End", "Escape"].includes(k)) {
      return;
    } else if (k.length === 1) {
      e.preventDefault();
    }
  });
  input.addEventListener("paste", e => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData("text") || "";
    const num = parseFloat(text.replace(/[^0-9.\-]/g, ""));
    if (isNaN(num)) return;
    mode = "cents";
    digits = String(Math.round(Math.abs(num) * 100));
    render();
  });
  input.getCents = () => {
    if (mode === "cents") return parseInt(digits, 10) || 0;
    return Math.round((parseFloat(dollarText) || 0) * 100);
  };
  input.setCents = c => { mode = "cents"; digits = String(Math.abs(c || 0)); dollarText = ""; render(); };
  render();
  return input;
}

/* ---------------- firebase setup ---------------- */
const CONFIG_PLACEHOLDER = !window.FIREBASE_CONFIG || window.FIREBASE_CONFIG.apiKey === "YOUR_API_KEY";
let auth = null, db = null;
if (!CONFIG_PLACEHOLDER && window.firebase) {
  firebase.initializeApp(window.FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.firestore();
}
const ALLOWLIST = (window.ALLOWLIST_EMAILS || []).map(e => e.toLowerCase());
function isAllowed(email) { return !!email && ALLOWLIST.includes(String(email).toLowerCase()); }

/* ---------------- app state ---------------- */
const COLLECTIONS = ["groups", "items", "monthLines", "accounts", "transactions", "splits",
  "recurring", "statementImports", "statementRows", "merchantMappings", "budgetMoves"];
const S = {
  user: null,
  groups: [], items: [], months: {}, monthLines: [], accounts: [],
  transactions: [], splits: [], recurring: [], statementImports: [],
  statementRows: [], merchantMappings: [], budgetMoves: [],
  loaded: false,
};
const UI = {
  tab: "budget",
  month: monthOf(todayStr()),
  activityQuery: "",
  reviewImportId: null,
};
let unsubscribers = [];

/* ---------------- firestore layer ---------------- */
function colRef(name) { return db.collection(name); }
function startListeners() {
  stopListeners();
  COLLECTIONS.forEach(name => {
    unsubscribers.push(colRef(name).onSnapshot(snap => {
      S[name] = snap.docs.map(d => d.data());
      S.loaded = true;
      render();
    }, err => console.error("listener", name, err)));
  });
  unsubscribers.push(db.collection("months").onSnapshot(snap => {
    S.months = {};
    snap.docs.forEach(d => { S.months[d.id] = d.data(); });
    S.loaded = true;
    if (!S.months[UI.month]) UI.month = activeMonth();
    render();
  }, err => console.error("listener months", err)));
}
function stopListeners() { unsubscribers.forEach(u => u()); unsubscribers = []; }

async function nextIds(coll, n) {
  const ref = db.collection("meta").doc("counters");
  return db.runTransaction(async tx => {
    const snap = await tx.get(ref);
    const data = snap.exists ? (snap.data() || {}) : {};
    const cur = (data[coll] || 1);
    const ids = [];
    for (let i = 0; i < n; i++) ids.push(cur + i);
    data[coll] = cur + n;
    tx.set(ref, data, { merge: true });
    return ids;
  });
}
async function nextId(coll) { return (await nextIds(coll, 1))[0]; }
function setDoc(coll, id, data) { return colRef(coll).doc(String(id)).set(data); }
function delDoc(coll, id) { return colRef(coll).doc(String(id)).delete(); }
async function batchWrite(ops) { // ops: [{type:'set'|'delete', coll, id, data}]
  for (let i = 0; i < ops.length; i += 400) {
    const batch = db.batch();
    ops.slice(i, i + 400).forEach(op => {
      const ref = op.coll === "months" ? db.collection("months").doc(String(op.id))
                                       : colRef(op.coll).doc(String(op.id));
      if (op.type === "set") batch.set(ref, op.data); else batch.delete(ref);
    });
    await batch.commit();
  }
}

/* ---------------- derived data (mirrors check_seed.py) ---------------- */
function groupById(id) { return S.groups.find(g => g.id === id); }
function itemById(id) { return S.items.find(i => i.id === id); }
function lineById(id) { return S.monthLines.find(l => l.id === id); }
function accountById(id) { return S.accounts.find(a => a.id === id); }
function isIncomeItem(itemId) {
  const it = itemById(itemId);
  const g = it && groupById(it.groupId);
  return !!(g && g.isIncome);
}
function monthsSorted() { return Object.keys(S.months).sort(); }
function lineOf(month, itemId) { return S.monthLines.find(l => l.month === month && l.itemId === itemId); }
function flowByLine() {
  const m = new Map();
  S.splits.forEach(s => m.set(s.monthLineId, (m.get(s.monthLineId) || 0) + s.amountCents));
  return m;
}
function movesNet(itemId, month) {
  let n = 0;
  S.budgetMoves.forEach(mv => {
    if (mv.month !== month) return;
    if (mv.fromItemId === itemId) n -= mv.amountCents;
    if (mv.toItemId === itemId) n += mv.amountCents;
  });
  return n;
}
function rolledOpening(itemId, month, flows) {
  let total = (itemById(itemId) || {}).openingBalanceCents || 0;
  for (const m of monthsSorted()) {
    if (m >= month) break;
    const l = lineOf(m, itemId);
    if (!l) continue;
    total += l.plannedCents + (flows.get(l.id) || 0) + movesNet(itemId, m);
  }
  return total;
}
function lineAvailable(line, flows) {
  const f = flows.get(line.id) || 0;
  if (isIncomeItem(line.itemId)) return line.plannedCents - f;
  return rolledOpening(line.itemId, line.month, flows) + line.plannedCents + f + movesNet(line.itemId, line.month);
}
function monthTotals(month, flows, includeArchivedPlan) {
  // Two populations, kept separate on purpose:
  // - PLAN figures (incPlanned / outPlanned / ltb) count only items still in
  //   the plan. An ARCHIVED item is out of the plan while archived, so its
  //   lines' Planned is excluded — an archived income line must not count
  //   as expected income while its card is invisible. (Pass
  //   includeArchivedPlan=true only for the actuals-side coverage math in
  //   balancer(), which must not move when an item is archived.)
  // - ACTUAL flows (received / spent) always count EVERY line: real money
  //   that moved against an item counts whether or not the item is
  //   currently archived, so balanceCheck's Budget (actual) never moves
  //   when an item is archived or unarchived.
  let incPlanned = 0, outPlanned = 0, received = 0, spent = 0;
  S.monthLines.filter(l => l.month === month).forEach(l => {
    const f = flows.get(l.id) || 0;
    const inPlan = includeArchivedPlan || !(itemById(l.itemId) || {}).archived;
    if (isIncomeItem(l.itemId)) { received += f; if (inPlan) incPlanned += l.plannedCents; }
    else { spent += -f; if (inPlan) outPlanned += l.plannedCents; }
  });
  return { incPlanned, outPlanned, received, spent, ltb: incPlanned - outPlanned };
}
function accountBalance(acctId) {
  const a = accountById(acctId);
  if (!a) return 0;
  return a.openingBalanceCents + S.transactions.filter(t => t.accountId === acctId)
    .reduce((s, t) => s + t.amountCents, 0);
}
function accountCleared(acctId) {
  const a = accountById(acctId);
  if (!a) return 0;
  return a.openingBalanceCents + S.transactions.filter(t => t.accountId === acctId && t.cleared)
    .reduce((s, t) => s + t.amountCents, 0);
}
function accountsTotal() { return S.accounts.filter(a => !a.archived).reduce((s, a) => s + accountBalance(a.id), 0); }
function carriedInto(month, flows) {
  return S.items.filter(i => !isIncomeItem(i.id)).reduce((s, i) => s + rolledOpening(i.id, month, flows), 0);
}
function balanceCheck(month, flows) {
  const t = monthTotals(month, flows);
  const carried = carriedInto(month, flows);
  const budgetLayer = carried + t.received - t.spent;
  const acctTotal = accountsTotal();
  // Expected-not-yet-received is a PLAN figure, so it is computed over the
  // income items still in the plan (not archived) on BOTH sides of the
  // subtraction: archiving an income item removes its expectation and its
  // receipts from this figure together, while the actuals above (carried,
  // received, spent, difference) always count every real flow.
  let expPlanned = 0, expReceived = 0;
  S.monthLines.filter(l => l.month === month).forEach(l => {
    if (!isIncomeItem(l.itemId) || (itemById(l.itemId) || {}).archived) return;
    expPlanned += l.plannedCents; expReceived += flows.get(l.id) || 0;
  });
  return {
    carried, received: t.received, spent: t.spent,
    budgetLayer, accountsTotal: acctTotal,
    difference: acctTotal - budgetLayer,
    expectedNotYetReceived: Math.max(0, expPlanned - expReceived),
  };
}
function activeMonth() {
  const ms = monthsSorted();
  if (!ms.length) return monthOf(todayStr());
  const cur = monthOf(todayStr());
  if (S.months[cur]) return cur;
  const past = ms.filter(m => m < cur);
  return past.length ? past[past.length - 1] : ms[0];
}
function balancer(flows) {
  const m = activeMonth();
  const assigned = S.monthLines.filter(l => l.month === m && !isIncomeItem(l.itemId))
    .reduce((s, l) => s + lineAvailable(l, flows), 0);
  const held = accountsTotal();
  // Coverage audits real money, so it keeps the full-population totals
  // (includeArchivedPlan=true): archiving an item must never move Assigned,
  // Held, Expected or the shortfall — every real transaction still counts.
  const t = monthTotals(m, flows, true);
  const expected = Math.max(0, t.incPlanned - t.received);
  const gap = assigned - held;
  const over = Math.max(0, gap - expected);
  return { month: m, assigned, held, gap, expected, over };
}
</script>
<script>
"use strict";
/* ---------------- rendering ---------------- */
function render() {
  if (!S.user) return;
  if (!S.loaded) { $("#main").innerHTML = '<div class="empty">Loading your budget…</div>'; return; }
  if (!Object.keys(S.months).length && UI.tab !== "more") { renderEmptyDatabase(); return; }
  const flows = flowByLine();
  renderHeader(flows);
  const main = $("#main");
  if (UI.tab === "budget") main.innerHTML = budgetView(flows);
  else if (UI.tab === "activity") main.innerHTML = activityView();
  else if (UI.tab === "review") main.innerHTML = reviewView();
  else if (UI.tab === "accounts") main.innerHTML = accountsView(flows);
  else if (UI.tab === "more") main.innerHTML = moreView();
  bindView(flows);
  $("#fab").classList.toggle("hidden", UI.tab !== "budget" && UI.tab !== "activity");
}
function renderEmptyDatabase() {
  $("#main").innerHTML = `<div class="card">
    <h3>Welcome</h3>
    <p>This budget is empty. Import the backup file to load your data:
    use the <b>Import backup</b> button below or the file picker (also under <b>More → Import backup</b>)
    and choose the seed backup JSON.</p>
    <div class="addrow"><button class="btn secondary small" data-act="importbackup">Import backup…</button></div>
    <div class="filepick"><input type="file" id="backup-file" accept=".json,application/json" aria-label="Choose backup file"></div>
  </div>`;
  bindBackupImport();
  $("#ltb-val").textContent = "$0.00";
  $("#m-select").innerHTML = "";
}
function renderHeader(flows) {
  const ms = monthsSorted();
  const sel = $("#m-select");
  sel.innerHTML = ms.map(m => `<option value="${m}" ${m === UI.month ? "selected" : ""}>${monthLabel(m)}</option>`).join("");
  const showMonthNav = UI.tab === "budget";
  $("#monthnav").style.visibility = showMonthNav ? "visible" : "hidden";
  $("#ltb-box").style.visibility = showMonthNav ? "visible" : "hidden";
  const t = monthTotals(UI.month, flows);
  $("#ltb-val").textContent = fmt(t.ltb);
  const over = $("#overbar");
  // The header over-budget bar IS the planning comparison: it renders the
  // browsed month's excess of put-ins over expected income (−Left to
  // Budget) whenever that goes negative. The Total Available Dollars
  // panel separately shows the planning verdict and the coverage verdict
  // for the active month.
  if (showMonthNav && t.ltb < 0) {
    over.textContent = fmt(-t.ltb) + " over budget";
    over.classList.remove("hidden");
  } else over.classList.add("hidden");
  const cb = $("#closedbar");
  if (showMonthNav && S.months[UI.month] && S.months[UI.month].closed) {
    cb.textContent = monthLabel(UI.month) + " is closed — planned amounts are locked.";
    cb.classList.remove("hidden");
  } else cb.classList.add("hidden");
  $("#who-line").textContent = S.user ? S.user.email : "";
  $$("#tabbar button").forEach(b => b.classList.toggle("active", b.dataset.tab === UI.tab));
}

function tadPanel(flows) {
  // HOME summary. Always computed for the ACTIVE month, never the browsed
  // month — same anchor as the Account Balancer. The Difference here is the
  // PLANNING difference (Matt's final word): expected income this month vs
  // what is planned into items — i.e. the active month's Left to Budget.
  // The accounts-vs-budget reconciliation (Budget (actual), accounts
  // Difference, coverage math) lives in the Accounts tab, untouched.
  const bc = balanceCheck(activeMonth(), flows);
  const t = monthTotals(activeMonth(), flows);
  return `<div class="card tad">
    <h3>Total Available Dollars</h3>
    <div class="kv"><span class="k">In your accounts</span><span class="v">${fmt(bc.accountsTotal)}</span></div>
    <div class="kv"><span class="k">Expected income this month</span><span class="v">${fmt(t.incPlanned)}</span></div>
    <div class="kv"><span class="k">Planned into items</span><span class="v">${fmt(t.outPlanned)}</span></div>
    <div class="kv"><span class="k">Difference</span><span class="v ${t.ltb < 0 ? "neg" : "pos"}">${fmtSigned(t.ltb)}</span></div>
    ${planDiffBanner(t.ltb)}
    <div class="kv"><span class="k muted">Expected, not yet received (not counted above)</span>
      <span class="v muted">${fmt(bc.expectedNotYetReceived)}</span></div>
    ${unassignedLine(bc.difference)}
  </div>`;
}

function lineCard(line, flows) {
  const f = flows.get(line.id) || 0;
  const income = isIncomeItem(line.itemId);
  const item = itemById(line.itemId) || {};
  const spent = income ? f : -f;
  const remaining = line.plannedCents - spent;
  const avail = lineAvailable(line, flows);
  const closed = S.months[line.month] && S.months[line.month].closed;
  // Non-income lines: Planned is a contribution into the item's accumulated pot, not a
  // spending cap — so the bar shows the share of the pot (Available + Spent) used this
  // month, and red appears only when the pot is overdrawn (Available < 0). Available
  // is the single "what's left to spend" number for EVERY line — bills and monthly
  // spending categories included — so cards show Planned / Spent / Available only.
  // The internal `remaining` value (Planned − Spent) is never displayed; it only
  // feeds the due-date "coming up" check below.
  // Income lines keep the received-vs-planned display, and their third figure is
  // labelled Outstanding (still owed to him), not Available — "available" is a
  // spending word and doesn't belong on income.
  const pot = avail + spent;
  const pct = income
    ? (line.plannedCents > 0 ? Math.min(100, Math.max(0, spent / line.plannedCents * 100)) : 0)
    : (pot > 0 ? Math.min(100, Math.max(0, spent / pot * 100)) : 0);
  // The ONLY per-line alarm is an overdrawn pot: red keys off Available < 0 for
  // every line, income included (for income, Available = Planned − Received,
  // so this is the same condition as before whenever Planned ≥ 0 — but nothing
  // anywhere flags merely spending/receiving past the Planned figure).
  const overCls = avail < 0 ? "over" : "";
  let due = "";
  if (item.dueDay) {
    const [y, mo] = line.month.split("-").map(Number);
    const dueDate = new Date(y, mo - 1, Math.min(item.dueDay, 28));
    const days = Math.round((dueDate - new Date(todayStr() + "T00:00:00")) / 86400000);
    const soon = line.month === monthOf(todayStr()) && days >= 0 && days <= 7 && remaining > 0;
    due = `<span class="due ${soon ? "soon" : ""}">Due day ${item.dueDay}${soon ? " — coming up" : ""}</span>`;
  }
  const target = item.targetCents ? `<div class="small muted" style="margin-top:4px;">Target ${fmt(item.targetCents)} · ${item.targetCents > 0 ? Math.max(0, Math.min(100, Math.round(avail / item.targetCents * 100))) : 0}% there</div>` : "";
  return `<div class="line-card">
    <div class="line-top">
      <div class="line-name" data-act="item" data-line="${line.id}">${esc(line.itemName)}${due}</div>
      <button class="star ${item.favorite ? "on" : ""}" data-act="fav" data-item="${line.itemId}" title="Favorite">${item.favorite ? "★" : "☆"}</button>
      ${income ? "" : `<button class="mvbtn" data-act="move" data-line="${line.id}" title="Move money from this item">⇄</button>`}
    </div>
    <div class="line-nums">
      <div class="cell"><div class="l">Planned</div>
        ${closed ? `<div class="n">${fmt(line.plannedCents)}</div>`
                 : `<input class="planned-edit money" data-line="${line.id}" value="${fmt(line.plannedCents)}" inputmode="numeric" aria-label="Planned for ${esc(line.itemName)}">`}
      </div>
      <div class="cell"><div class="l">${income ? "Received" : "Spent"}</div><div class="n">${fmt(spent)}</div></div>
      <div class="cell avail"><div class="l">${income ? "Outstanding" : "Available"}</div><div class="n ${avail < 0 ? "neg" : ""}">${fmt(avail)}</div></div>
    </div>
    ${target}
    <div class="progress"><div class="${overCls}" style="width:${pct}%"></div></div>
  </div>`;
}

function budgetView(flows) {
  const month = UI.month;
  // Archived items are out of the plan: their cards (and their group
  // subtotals and Favorites entries, which derive from this list) are not
  // rendered. Their lines and transactions still exist and still count in
  // every actuals figure — see monthTotals/balanceCheck.
  const lines = S.monthLines.filter(l => l.month === month && !(itemById(l.itemId) || {}).archived);
  const byGroup = new Map();
  lines.forEach(l => { if (!byGroup.has(l.groupId)) byGroup.set(l.groupId, []); byGroup.get(l.groupId).push(l); });
  const groups = S.groups.slice().sort((a, b) => a.sortOrder - b.sortOrder || a.id - b.id);
  const closed = S.months[month] && S.months[month].closed;
  let h = "";
  // account boxes
  h += `<div class="acctrow">` + S.accounts.filter(a => !a.archived)
    .sort((a, b) => a.sortOrder - b.sortOrder || a.id - b.id).map(a => `
    <div class="acctbox" data-act="gotoaccounts">
      <div class="nm">${esc(a.name)}</div>
      <div class="bl">${fmt(accountBalance(a.id))}</div>
      <div class="cl">Cleared ${fmt(accountCleared(a.id))}</div>
    </div>`).join("") + `</div>`;
  h += tadPanel(flows);
  // favorites first
  const favLines = lines.filter(l => (itemById(l.itemId) || {}).favorite);
  if (favLines.length) {
    h += `<div class="grouphead"><span class="gn">★ Favorites</span></div>`;
    h += favLines.map(l => lineCard(l, flows)).join("");
  }
  groups.forEach(g => {
    const gl = (byGroup.get(g.id) || []).slice().sort((a, b) => a.sortOrder - b.sortOrder || a.id - b.id);
    if (!gl.length && closed) return;
    const tot = gl.reduce((s, l) => s + l.plannedCents, 0);
    h += `<div class="grouphead"><span class="gn">${esc(g.name)}</span><span class="gt">Planned ${fmt(tot)}</span></div>`;
    h += gl.map(l => lineCard(l, flows)).join("");
    if (!closed) h += `<div class="addrow"><button class="btn secondary small" data-act="additem" data-group="${g.id}">+ Add item to ${esc(g.name)}</button></div>`;
  });
  if (!closed) h += `<div class="addrow"><button class="btn secondary small" data-act="addgroup">+ Add group</button>
    <button class="btn secondary small" data-act="nextmonth">Create ${monthLabel(addMonths(monthsSorted()[monthsSorted().length - 1] || month, 1))} →</button></div>`;
  // month memo + close
  h += `<div class="card"><h3>Month memo</h3>
    <textarea id="month-memo" rows="3" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;">${esc((S.months[month] || {}).memo || "")}</textarea>
    <div style="margin-top:8px; display:flex; gap:8px;">
      <button class="btn small secondary" data-act="savememo">Save memo</button>
      ${closed ? `<button class="btn small secondary" data-act="reopenmonth">Reopen month</button>`
               : `<button class="btn small secondary" data-act="closemonth">Month Close…</button>`}
    </div></div>`;
  return h;
}

<script>
"use strict";
/* ---------------- activity ---------------- */
function txnItemLabel(t) {

}
function activityView() {

  let h = `<input class="searchbar" id="activity-search" type="search" placeholder="Search merchant, note, or budget item…" value="${esc(UI.activityQuery)}">`;

      <div class="main">
        <div class="merch">${esc(t.merchant)}</div>

    </div>`;
  }).join("");
  const moves = S.budgetMoves.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  if (moves.length) {

/* ---------------- review (statement import) ---------------- */
function merchantKey(desc) {
  const STOP = new Set(["pos", "web", "ppd", "ach", "purchase", "payments", "the", "co", "inc", "llc", "com", "www", "us", "usa"]);
  const toks = String(desc || "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").split(/\s+/)
    .filter(t => t && !/^\d+$/.test(t) && !STOP.has(t));
  return toks.slice(0, 3).join(" ");
}
function guessItemFor(desc) {
  const toks = new Set(String(desc || "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").split(/\s+/).filter(Boolean));
  for (const m of S.merchantMappings) {
    const keyToks = String(m.merchantKey || "").toLowerCase().split(/\s+/).filter(Boolean);
    if (keyToks.length && keyToks.every(t => toks.has(t))) {
      const it = itemById(m.itemId);
      if (it) return it;
    }
  }
  return null;
}
function isDuplicateRow(date, amountCents, desc) {
  const key = merchantKey(desc);
  return S.transactions.some(t => {
    if (t.date !== date || t.amountCents !== amountCents) return false;
    const tk = merchantKey(t.merchant);
    return tk === key || (tk && key && (tk.includes(key) || key.includes(tk)));
  }) || S.statementRows.some(r => r.date === date && r.amountCents === amountCents &&
       merchantKey(r.description) === key && r.status !== "skipped");
}
function reviewView() {

  const imps = S.statementImports.slice().sort((a, b) => b.id - a.id);

      imps.map(i => `<option value="${i.id}" ${i.id === UI.reviewImportId ? "selected" : ""}>${esc(i.sourceName)} — ${i.totalRows} rows, ${i.newRows} new, ${i.duplicateRows} duplicates</option>`).join("") +

<script>
"use strict";
/* ---------------- modal ---------------- */
/* Background scroll lock. While any modal is open the page behind it must
   not scroll — on iOS the reliable way is to freeze the body with
   position:fixed at the current scroll offset (plain overflow:hidden on
   html/body does NOT stop rubber-band/background scrolling in iOS
   Safari/standalone). modalScrollY doubles as the lock flag: it holds the
   offset saved by the FIRST modal that opened. A modal opened over (or in
   place of) another — e.g. a confirmation — finds the lock already held
   and must not overwrite the saved offset (the frozen page reports a
   scroll position of 0); the single closeModal() that empties the modal
   root releases the lock and restores the exact prior position. */
let modalScrollY = null;
function lockBodyScroll() {
  if (modalScrollY !== null) return; // already locked: keep the original offset
  modalScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  document.body.style.top = "-" + modalScrollY + "px";
  document.body.classList.add("scroll-locked");
}
function unlockBodyScroll() {
  if (modalScrollY === null) return;
  const y = modalScrollY;
  modalScrollY = null;
  document.body.classList.remove("scroll-locked");
  document.body.style.top = "";
  window.scrollTo(0, y);
}
function openModal(html) {
  $("#modal-root").innerHTML = `<div class="modal-bg" id="modal-bg"><div class="modal">${html}</div></div>`;
  lockBodyScroll();
  $("#modal-bg").addEventListener("click", e => { if (e.target.id === "modal-bg") closeModal(); });
}
function closeModal() { $("#modal-root").innerHTML = ""; unlockBodyScroll(); }
function modalActions(saveLabel, extra) {
  return `<div class="actions">${extra || ""}<button class="btn secondary" data-close>Cancel</button>
    <button class="btn" data-save>${esc(saveLabel || "Save")}</button></div>`;
}
function bindModalClose() {
  $$("#modal-root [data-close]").forEach(b => b.addEventListener("click", closeModal));
}
function fieldHtml(label, inner, hint) {
  return `<div class="field"><label>${esc(label)}</label>${inner}${hint ? `<div class="hint">${esc(hint)}</div>` : ""}</div>`;
}

/* ---------------- months: create / copy-forward ---------------- */
async function ensureMonth(month, silent) {
  if (S.months[month]) return true;
  const ms = monthsSorted();
  const earlier = ms.filter(m => m < month);
  const source = earlier.length ? earlier[earlier.length - 1] : (ms.find(m => m > month) || null);
  if (!source) { if (!silent) toast("No month to copy from yet."); return false; }
  if (!silent && !confirm(`Create ${monthLabel(month)} by copying ${monthLabel(source)}?`)) return false;
  // Archived items get no line in the new month.
  const srcLines = S.monthLines.filter(l => l.month === source && !(itemById(l.itemId) || {}).archived)
    .sort((a, b) => a.sortOrder - b.sortOrder || a.id - b.id);
  const ids = await nextIds("monthLines", srcLines.length);
  const ops = [{ type: "set", coll: "months", id: month, data: { month, closed: false, memo: "" } }];
  srcLines.forEach((l, i) => {
    ops.push({ type: "set", coll: "monthLines", id: ids[i], data: copiedLineData(l, ids[i], month) });
  });
  await batchWrite(ops);
  toast(monthLabel(month) + " created");
  return true;
}
/* One copied-forward budget line, exactly as ensureMonth() builds it: same
   item, group and order; the item's recurring Planned wins when one is set.
   No opening is stored on the line — roll-forward derives from the earlier
   months' results. Shared by month creation and month restart so the two
   can never drift apart. */
function copiedLineData(l, id, month) {
  const item = itemById(l.itemId);
  const planned = item && item.recurringPlannedCents != null ? item.recurringPlannedCents : l.plannedCents;
  return { id, month, itemId: l.itemId, groupId: l.groupId,
    itemName: item ? item.name : l.itemName, groupName: l.groupName,
    plannedCents: planned, sortOrder: l.sortOrder };
}

/* ---------------- months: delete / restart ---------------- */
/* A month "has activity" when any recorded transaction split lands on one
   of its lines. Such a month is history and is never deleted or restarted. */
function monthHasActivity(month) {
  const ids = new Set(S.monthLines.filter(l => l.month === month).map(l => l.id));
  return S.splits.some(s => ids.has(s.monthLineId));
}
async function deleteMonth(month) {
  if (monthsSorted().length <= 1) { toast("That's the only month left — it can't be deleted."); return; }
  if (monthHasActivity(month)) { toast("This month has transactions recorded, so it can't be deleted."); return; }
  const ok = await confirmActionModal("Delete " + monthLabel(month) + "?",
    "Its budget lines will be removed. This can't be undone.", "Delete month");
  if (!ok) return;
  const ops = S.monthLines.filter(l => l.month === month)
    .map(l => ({ type: "delete", coll: "monthLines", id: l.id }));
  ops.push({ type: "delete", coll: "months", id: month });
  await batchWrite(ops);
  if (UI.month === month) {
    const rest = monthsSorted().filter(m => m !== month);
    if (rest.length) { UI.month = rest[rest.length - 1]; render(); }
  }
  toast(monthLabel(month) + " deleted");
}
async function restartMonth(month) {
  const ms = monthsSorted();
  const idx = ms.indexOf(month);
  if (idx <= 0) { toast("There's no previous month to restart " + monthLabel(month) + " from."); return; }
  if (monthHasActivity(month)) { toast("This month has transactions recorded, so it can't be restarted."); return; }
  const source = ms[idx - 1];
  const ok = await confirmActionModal("Restart " + monthLabel(month) + "?",
    "Restart " + monthLabel(month) + " from " + monthLabel(source) +
    "? Its current lines will be replaced with a fresh copy of " + monthLabel(source) + "'s.",
    "Restart month");
  if (!ok) return;
  // Archived items get no line in the restarted month either.
  const srcLines = S.monthLines.filter(l => l.month === source && !(itemById(l.itemId) || {}).archived)
    .sort((a, b) => a.sortOrder - b.sortOrder || a.id - b.id);
  const ids = await nextIds("monthLines", srcLines.length);
  const ops = S.monthLines.filter(l => l.month === month)
    .map(l => ({ type: "delete", coll: "monthLines", id: l.id }));
  ops.push({ type: "set", coll: "months", id: month, data: { month, closed: false, memo: "" } });
  srcLines.forEach((l, i) => {
    ops.push({ type: "set", coll: "monthLines", id: ids[i], data: copiedLineData(l, ids[i], month) });
  });
  await batchWrite(ops);
  toast(monthLabel(month) + " restarted from " + monthLabel(source));
}

/* ---------------- transaction form ---------------- */
let txnFormState = null; // {txnId|null, splits:[{lineId, cents}], statementRowId|null, accountId}
function openTxnForm(opts) {
  opts = opts || {};
  const t = opts.txn || null;
  const date = (t && t.date) || opts.date || todayStr();
  const month = monthOf(date);
  txnFormState = {
    txnId: t ? t.id : null,
    statementRowId: opts.statementRowId || null,
    prefillDesc: opts.description || "",
  };
  const existingSplits = t ? S.splits.filter(s => s.transactionId === t.id) : [];
  const initSplits = existingSplits.length ? existingSplits.map(s => ({ lineId: s.monthLineId, cents: Math.abs(s.amountCents) }))
    : (opts.itemId && lineOf(month, opts.itemId) ? [{ lineId: lineOf(month, opts.itemId).id, cents: Math.abs(opts.amountCents || 0) }]
    : [{ lineId: null, cents: Math.abs((t && t.amountCents) || opts.amountCents || 0) }]);
  const dirOut = t ? t.amountCents < 0 : (opts.amountCents == null ? true : opts.amountCents < 0);
  // An income item can carry a planned destination account (items.accountId,
  // set by the income Planned prompt). Recording money against such a line
  // starts the account picker on that account. It is a DEFAULT only: an
  // existing transaction's account, an explicit opts.accountId, or any
  // manual pick in the form always wins.
  let defaultAccountId = t ? t.accountId : (opts.accountId != null ? opts.accountId : null);
  if (defaultAccountId == null && opts.itemId && isIncomeItem(opts.itemId)) {
    const di = itemById(opts.itemId);
    if (di && di.accountId != null) defaultAccountId = di.accountId;
  }
  openModal(`<h2>${t ? "Edit transaction" : "Add transaction"}</h2>
    <div class="seg" id="txn-dir">
      <button data-dir="out" class="${dirOut ? "on" : ""}">Money out</button>
      <button data-dir="in" class="${!dirOut ? "on" : ""}">Money in</button>
    </div>
    ${fieldHtml("Date", `<input type="date" id="tf-date" value="${date}">`)}
    ${fieldHtml("Merchant / description", `<input type="text" id="tf-merch" value="${esc(t ? t.merchant : (opts.description || ""))}" placeholder="e.g. Market Basket">`)}
    ${fieldHtml("Amount", `<input type="text" id="tf-amount" inputmode="numeric" value="">`)}
    ${fieldHtml("Account", `<select id="tf-account">${S.accounts.filter(a => !a.archived).map(a =>
      `<option value="${a.id}" ${defaultAccountId === a.id ? "selected" : ""}>${esc(a.name)}</option>`).join("")}</select>`)}
    <div class="field"><label>Budget item(s)</label><div id="tf-splits"></div>
      <div class="hint" id="tf-split-sum"></div>
      <button class="btn small secondary" id="tf-addsplit" type="button">+ Split across items</button></div>
    ${fieldHtml("Note", `<input type="text" id="tf-note" value="${esc(t ? (t.note || "") : "")}">`)}
    <div class="field"><label><input type="checkbox" id="tf-cleared" ${t && t.cleared ? "checked" : ""} style="width:auto;"> Cleared</label></div>

  bindModalClose();
  const amtInput = attachMoneyInput($("#tf-amount"), Math.abs(t ? t.amountCents : (opts.amountCents || 0)));
  txnFormState.amountInput = amtInput;

  $$("#txn-dir button").forEach(b => b.addEventListener("click", () => {
    txnFormState.dir = b.dataset.dir;

  // If a split is (re)pointed at an income line with a designated account,

  let acctTouched = opts.accountId != null;
  $("#tf-account").addEventListener("change", () => { acctTouched = true; });
  function applyIncomeDesignation(lineId) {
    if (t || acctTouched) return;

    if (!ln || !isIncomeItem(ln.itemId)) return;
    const it = itemById(ln.itemId);

async function saveTxnForm() {
  const st = txnFormState;
  const date = $("#tf-date").value;
  if (!date) { toast("Pick a date"); return; }

  if (!S.months[month]) { if (!(await ensureMonth(month))) return; }
  const merchant = $("#tf-merch").value.trim() || "(no description)";
  const totalAbs = st.amountInput.getCents();
  if (totalAbs <= 0) { toast("Enter an amount"); return; }
  const sign = st.dir === "out" ? -1 : 1;
  // resolve split rows → line ids in the transaction's month
  st.splitRows.forEach(r => { if (r.input) r.cents = r.input.getCents(); });
  let rows = st.splitRows.filter(r => r.cents > 0);
  if (!rows.length) rows = [{ lineId: st.splitRows[0] && st.splitRows[0].lineId, cents: totalAbs }];
  // remap each chosen line to the same item's line in the txn month
  rows = rows.map(r => {
    const chosen = r.lineId ? lineById(r.lineId) : null;
    const itemId = chosen ? chosen.itemId : null;
    const target = itemId ? lineOf(month, itemId) : null;
    return { lineId: target ? target.id : null, itemId, cents: r.cents };
  }).filter(r => r.lineId);
  if (!rows.length) { toast("Pick at least one budget item"); return; }
  const sum = rows.reduce((s, r) => s + r.cents, 0);
  if (sum !== totalAbs) { toast(`Splits (${fmt(sum)}) must add up to the amount (${fmt(totalAbs)})`); return; }

  const note = $("#tf-note").value.trim();
  const cleared = $("#tf-cleared").checked;
  let txnId = st.txnId;

  if (txnId) {
    S.splits.filter(s => s.transactionId === txnId).forEach(s => ops.push({ type: "delete", coll: "splits", id: s.id }));
  } else {
    txnId = await nextId("transactions");
  }
  const old = st.txnId ? S.transactions.find(t => t.id === txnId) : null;
  const txn = {
    id: txnId, date, merchant, note, amountCents: sign * totalAbs, accountId,
    cleared, kind: old ? old.kind : "standard",
    transferGroup: old ? old.transferGroup : null,
    receiptBlobKey: old ? old.receiptBlobKey : null,
    recurringId: old ? old.recurringId : null,
    createdAt: old ? old.createdAt : new Date().toISOString(),
  };
  ops.push({ type: "set", coll: "transactions", id: txnId, data: txn });
  const splitIds = await nextIds("splits", rows.length);
  rows.forEach((r, i) => ops.push({ type: "set", coll: "splits", id: splitIds[i],
    data: { id: splitIds[i], transactionId: txnId, monthLineId: r.lineId, amountCents: sign * r.cents } }));
  await batchWrite(ops);
  if (st.statementRowId) {
    const row = S.statementRows.find(r => r.id === st.statementRowId);
    if (row) await setDoc("statementRows", row.id, { ...row, status: "confirmed", transactionId: txnId });
  }
  closeModal();
  toast("Transaction saved");
}
