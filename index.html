<script>
"use strict";
/* ---------------- CSV parsing (bank statements) ---------------- */
function parseCSVText(text) {
  const rows = [];
  let row = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); field = "";
      if (row.some(f => f.trim() !== "")) rows.push(row);
      row = [];
    } else field += c;
  }
  row.push(field);
  if (row.some(f => f.trim() !== "")) rows.push(row);
  return rows;
}
function parseDateCell(s) {
  s = String(s || "").trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) {
    let y = Number(m[3]); if (y < 100) y += 2000;
    return `${y}-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}`;
  }
  return null;
}
function parseAmountCell(s) {
  s = String(s || "").trim();
  if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[$,\s]/g, "");
  if (s.startsWith("-")) { neg = true; s = s.slice(1); }
  const v = parseFloat(s);
  if (isNaN(v)) return null;
  return Math.round((neg ? -v : v) * 100);
}
function csvToStatementRows(text) {
  const grid = parseCSVText(text);
  let hi = -1;
  for (let i = 0; i < Math.min(grid.length, 12); i++) {
    const names = grid[i].map(h => h.toLowerCase().replace(/[^a-z]/g, ""));
    if (names.some(n => n.includes("date")) &&
        names.some(n => n.includes("description") || n.includes("merchant") || n === "name" || n.includes("amount") || n.includes("debit"))) { hi = i; break; }
  }
  if (hi < 0) return [];
  const names = grid[hi].map(h => h.toLowerCase().replace(/[^a-z]/g, ""));
  const find = (...keys) => names.findIndex(n => keys.some(k => n === k || n.includes(k)));
  const dI = find("date");
  const descI = find("description", "merchant", "name", "memo", "payee");
  const amtI = find("amount");
  const debI = names.findIndex(n => n.includes("debit") || n.includes("withdrawal"));
  const credI = names.findIndex(n => n.includes("credit") || n.includes("deposit"));
  const out = [];
  for (let i = hi + 1; i < grid.length; i++) {
    const r = grid[i];
    const date = dI >= 0 ? parseDateCell(r[dI]) : null;
    const desc = descI >= 0 ? String(r[descI] || "").replace(/\s+/g, " ").trim() : "";
    let cents = null;
    if (debI >= 0 || credI >= 0) {
      const deb = debI >= 0 ? parseAmountCell(r[debI]) : null;
      const cred = credI >= 0 ? parseAmountCell(r[credI]) : null;
      if (cred) cents = Math.abs(cred);
      else if (deb) cents = -Math.abs(deb);
    } else if (amtI >= 0) cents = parseAmountCell(r[amtI]);
    if (!date || !desc || !cents) continue;
    out.push({ date, description: desc, amountCents: cents });
  }
  return out;
}

/* ---------------- statement import & confirm ---------------- */
async function handleStatementFile(file, accountId) {
  const text = await file.text();
  const parsed = csvToStatementRows(text);
  if (!parsed.length) { toast("No statement rows found in that CSV — check the file format."); return; }
  const impId = await nextId("statementImports");
  const rowIds = await nextIds("statementRows", parsed.length);
  const seen = new Set();
  let newCount = 0, dupCount = 0;
  const ops = [];
  parsed.forEach((r, i) => {
    const key = r.date + "|" + r.amountCents + "|" + merchantKey(r.description);
    let status = "pending";
    if (seen.has(key) || isDuplicateRow(r.date, r.amountCents, r.description)) { status = "duplicate"; dupCount++; }
    else newCount++;
    seen.add(key);
    const guess = guessItemFor(r.description);
    ops.push({ type: "set", coll: "statementRows", id: rowIds[i], data: {
      id: rowIds[i], importId: impId, date: r.date, description: r.description,
      amountCents: r.amountCents,
      guessedItemId: guess ? guess.id : null, guessedItemName: guess ? guess.name : null,
      status, transactionId: null } });
  });
  ops.unshift({ type: "set", coll: "statementImports", id: impId, data: {
    id: impId, sourceName: file.name, importedAt: new Date().toISOString(),
    totalRows: parsed.length, newRows: newCount, duplicateRows: dupCount, accountId } });
  await batchWrite(ops);
  UI.reviewImportId = impId;
  UI.tab = "review";
  toast(`Imported ${parsed.length} rows — ${newCount} new, ${dupCount} duplicates`);
  render();
}
async function learnMapping(desc, itemId, ops) {
  const key = merchantKey(desc);
  if (!key) return;
  const existing = S.merchantMappings.find(m => m.merchantKey === key);
  if (existing) {
    if (existing.itemId !== itemId) ops.push({ type: "set", coll: "merchantMappings", id: existing.id, data: { ...existing, itemId } });
  } else {
    const id = await nextId("merchantMappings");
    ops.push({ type: "set", coll: "merchantMappings", id, data: { id, merchantKey: key, itemId } });
  }
}
async function confirmStatementRow(row, itemId) {
  const month = monthOf(row.date);
  if (!S.months[month] && !(await ensureMonth(month, true))) { toast("Couldn't create " + monthLabel(month)); return false; }
  const line = lineOf(month, itemId);
  if (!line) { toast("That item has no line in " + monthLabel(month)); return false; }
  const imp = S.statementImports.find(i => i.id === row.importId);
  const accountId = (imp && imp.accountId) || (S.accounts.find(a => !a.archived) || {}).id;
  const txnId = await nextId("transactions");
  const splitId = await nextId("splits");
  const ops = [
    { type: "set", coll: "transactions", id: txnId, data: {
      id: txnId, date: row.date, merchant: row.description, note: "",
      amountCents: row.amountCents, accountId, cleared: true, kind: "standard",
      transferGroup: null, receiptBlobKey: null, recurringId: null,
      createdAt: new Date().toISOString() } },
    { type: "set", coll: "splits", id: splitId, data: {
      id: splitId, transactionId: txnId, monthLineId: line.id, amountCents: row.amountCents } },
    { type: "set", coll: "statementRows", id: row.id, data: { ...row, status: "confirmed", transactionId: txnId } },
  ];
  await learnMapping(row.description, itemId, ops);
  await batchWrite(ops);
  return true;
}

/* ---------------- income planned: destination prompt ----------------
   savePlannedAmount is the ONE shared path for saving a line's Planned
   amount (the card's inline edit is the only Planned editor — the item
   detail shows Planned read-only), and the Add-item form routes a new
   income card's Planned amount through the same prompt. Spending/savings
   lines save exactly as they always have. Income lines are different
   (Matt): planned income is DESIGNATED for an account — "Is it going to
   be money that's planned to go into my cash account? Into my checking
   account? Into my high yield savings? That's what it's asking." — so
   when Planned INCREASES on an income line in an open month (edit or
   brand-new card), ask only: "Which account is this money planned to go
   into?" Choosing an account stores the designation (items.accountId)
   and NOTHING else: no transaction, no balance change, no Received
   change. Planned income becomes actually available only when it is
   received, and receipt stays a separate act through the ordinary flows
   (Add transaction, statement import, recurring) — the manual
   transaction form's account picker defaults to the designated account
   when a split targets the income line (see openTxnForm). */
async function savePlannedAmount(line, newCents) {
  const oldCents = line.plannedCents;
  if (newCents === oldCents) return;
  await setDoc("monthLines", line.id, { ...line, plannedCents: newCents });
  const increase = newCents - oldCents;
  const monthClosed = !!(S.months[line.month] && S.months[line.month].closed);
  if (increase > 0 && !monthClosed && isIncomeItem(line.itemId)) {
    promptIncomeDestination({ ...line, plannedCents: newCents }, increase);
  }
}

function promptIncomeDestination(line, cents, itemHint) {
  const item = itemHint || itemById(line.itemId) || {};
  const accounts = S.accounts.filter(a => !a.archived);
  openModal(`<h2>${esc(line.itemName)}</h2>
    <p>You added ${fmt(cents)} to ${esc(line.itemName)}. Which account is this money planned to go into?</p>
    <div class="actions" style="flex-direction:column;align-items:stretch;">
      ${accounts.map(a => `<button class="btn" data-inc-acct="${a.id}">${esc(a.name)}</button>`).join("")}
      <button class="btn secondary" data-inc-skip>Decide later</button>
    </div>`);
  $$("#modal-root [data-inc-acct]").forEach(b => b.addEventListener("click", async () => {
    const accountId = Number(b.dataset.incAcct);
    const acctName = (accountById(accountId) || {}).name || "the account";
    if (item.id != null && item.accountId !== accountId) {
      await setDoc("items", item.id, { ...item, accountId });
    }
    closeModal();
    toast(`${line.itemName} is planned to go into ${acctName}.`);
  }));
  const skip = $("#modal-root [data-inc-skip]");
  if (skip) skip.addEventListener("click", closeModal);
}

/* ---------------- view binding & actions ---------------- */
/* Shared by the More view and the empty-database welcome screen: wires the
   Import backup button + visible file input to the same handleBackupFile().
   The input stays in the layout (never display:none) so browser file-upload
   tooling can target it directly; the button also triggers it for convenience. */
function bindBackupImport() {
  const bf = $("#backup-file");
  if (bf) bf.addEventListener("change", async () => {
    const f = bf.files[0];
    if (!f) return;
    try { await handleBackupFile(f); } finally { bf.value = ""; } // reset so the same file can be picked again
  });
  const impBtn = $("[data-act='importbackup']");
  if (impBtn) impBtn.addEventListener("click", () => { const f = $("#backup-file"); if (f) f.click(); });
}
function bindView(flows) {
  $$(".planned-edit").forEach(inp => {
    const line = lineById(Number(inp.dataset.line));
    if (!line) return;
    const mi = attachMoneyInput(inp, line.plannedCents, { dollar: true });
    inp.addEventListener("blur", async () => {
      await savePlannedAmount(line, mi.getCents());
    });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); });
  });
  $$("#main [data-act]").forEach(el => el.addEventListener("click", e => handleAct(el, e)));
  const sb = $("#activity-search");
  if (sb) sb.addEventListener("input", () => {
    UI.activityQuery = sb.value;
    render();
    const n = $("#activity-search");
    if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
  });
  const pick = $("#imp-pick");
  if (pick) pick.addEventListener("click", () => $("#imp-file").click());
  const file = $("#imp-file");
  if (file) file.addEventListener("change", async () => {
    if (file.files[0]) await handleStatementFile(file.files[0], Number($("#imp-account").value));
  });
  const isel = $("#imp-select");
  if (isel) isel.addEventListener("change", () => { UI.reviewImportId = Number(isel.value); render(); });
  bindBackupImport();
}

/* Hard refresh: best-effort clear of Cache Storage, then reload with a
   cache-busting query param so iOS fetches fresh HTML/JS. App data lives in
   Firestore and the sign-in lives in Firebase Auth — neither is touched. */
async function hardRefresh() {
  try {
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (err) { /* cache clearing is best-effort; the reload is the point */ }
  const url = new URL(window.location.href);
  url.searchParams.set("v", String(Date.now())); // set() replaces any existing v param
  window.location.replace(url.toString());
}

async function handleAct(el, e) {
  const act = el.dataset.act;
  const flows = flowByLine();
  switch (act) {
    case "fav": {
      const item = itemById(Number(el.dataset.item));
      if (item) await setDoc("items", item.id, { ...item, favorite: !item.favorite });
      break;
    }
    case "unarchive": {
      const item = itemById(Number(el.dataset.item));
      if (item) { await setDoc("items", item.id, { ...item, archived: false }); toast("Item unarchived"); }
      break;
    }
    case "item": openItemDetail(Number(el.dataset.line)); break;
    case "move": openMoveForm(Number(el.dataset.line)); break;
    case "gotoaccounts": UI.tab = "accounts"; render(); break;
    case "additem": openAddItem(Number(el.dataset.group)); break;
    case "addgroup": openAddGroup(); break;
    case "nextmonth": {
      const latest = monthsSorted()[monthsSorted().length - 1];
      const nm = addMonths(latest, 1);
      if (await ensureMonth(nm)) { UI.month = nm; render(); }
      break;
    }
    case "deletemonth": await deleteMonth(el.dataset.month); break;
    case "restartmonth": await restartMonth(el.dataset.month); break;
    case "savememo": {
      const memo = $("#month-memo").value;
      await setDoc("months", UI.month, { ...(S.months[UI.month] || { month: UI.month, closed: false }), month: UI.month, memo });
      toast("Memo saved");
      break;
    }
    case "closemonth": openMonthClose(flows); break;
    case "reopenmonth":
      await setDoc("months", UI.month, { ...S.months[UI.month], closed: false });
      toast("Month reopened");
      break;
    case "edittxn": {
      const t = S.transactions.find(x => x.id === Number(el.dataset.txn));
      if (t) openTxnForm({ txn: t });
      break;
    }
    case "togglecleared": {
      e.stopPropagation();
      const t = S.transactions.find(x => x.id === Number(el.dataset.txn));
      if (t) await setDoc("transactions", t.id, { ...t, cleared: !t.cleared });
      break;
    }
    case "confirmrow": {
      const row = S.statementRows.find(r => r.id === Number(el.dataset.row));
      if (!row) break;
      const sel = $("#row-item-" + row.id);
      const itemId = (sel && sel.value) ? Number(sel.value)
        : (row.guessedItemId || (guessItemFor(row.description) || {}).id);
      if (!itemId) { toast("Pick a budget item for that row first"); break; }
      if (await confirmStatementRow(row, itemId)) toast("Confirmed");
      break;
    }
    case "splitrow": {
      const row = S.statementRows.find(r => r.id === Number(el.dataset.row));
      if (!row) break;
      const sel = $("#row-item-" + row.id);
      const imp = S.statementImports.find(i => i.id === row.importId);
      openTxnForm({ date: row.date, description: row.description, amountCents: row.amountCents,
        accountId: imp ? imp.accountId : null, itemId: sel ? Number(sel.value) : null,
        statementRowId: row.id });
      break;
    }
    case "skiprow": {
      const row = S.statementRows.find(r => r.id === Number(el.dataset.row));
      if (row) await setDoc("statementRows", row.id, { ...row, status: "skipped" });
      break;
    }
    case "confirmall": {
      const rows = S.statementRows.filter(r => r.importId === UI.reviewImportId && r.status === "pending")
        .sort((a, b) => a.id - b.id);
      let done = 0;
      for (const row of rows) {
        const sel = $("#row-item-" + row.id);
        const itemId = sel ? Number(sel.value) : (row.guessedItemId || (guessItemFor(row.description) || {}).id);
        if (itemId && await confirmStatementRow(row, itemId)) done++;
      }
      toast(`Confirmed ${done} of ${rows.length} rows`);
      break;
    }
    case "setbalance": openSetBalance(Number(el.dataset.acct)); break;
    case "reconcile": openReconcile(Number(el.dataset.acct)); break;
    case "addaccount": openAddAccount(); break;
    case "transfer": openTransfer(); break;
    case "addrecurring": openAddRecurring(); break;
    case "postdue": await postAllDue(); break;
    case "postrecurring": {
      const r = S.recurring.find(x => x.id === Number(el.dataset.id));
      if (r) { await postRecurring(r, r.nextDate, 1); toast("Posted"); }
      break;
    }
    case "delrecurring": {
      const r = S.recurring.find(x => x.id === Number(el.dataset.id));
      if (r && confirm(`Delete the recurring "${r.merchant}"?`)) await delDoc("recurring", r.id);
      break;
    }
    case "exportbackup": exportBackup(); break;
    case "exporttxns": exportTransactionsCSV(); break;
    case "exportbudget": exportBudgetCSV(flows); break;
    case "print": window.print(); break;
    case "hardrefresh": await hardRefresh(); break;
    case "signout": if (auth) await auth.signOut(); break;
  }
}
</script>
<script>
"use strict";
/* ---------------- account operations ---------------- */
function fmtNoComma(c) {
  const neg = c < 0, a = Math.abs(c);
  return (neg ? "-$" : "$") + Math.floor(a / 100) + "." + String(a % 100).padStart(2, "0");
}
/* The plain dated Balance adjustment — decreases only. Increases are
   refused outright in openSetBalance: the only way money gets INTO an
   account is an income amount recorded against an income item with
   that account chosen (or the receiving side of a transfer). */
async function writeBalanceAdjustment(a, target, cur, diff) {
  const id = await nextId("transactions");
  await setDoc("transactions", id, {
    id, date: todayStr(), merchant: "Balance adjustment",
    note: `${a.name} balance set by hand to ${fmtNoComma(target)} (was ${fmtNoComma(cur)}).`,
    amountCents: diff, accountId: a.id, cleared: true, kind: "standard",
    transferGroup: null, receiptBlobKey: null, recurringId: null,
    createdAt: new Date().toISOString() });
}

function openSetBalance(acctId) {
  const a = accountById(acctId);
  if (!a) return;
  const cur = accountBalance(acctId);
  openModal(`<h2>Set balance — ${esc(a.name)}</h2>
    <p class="small muted">Type the exact amount this account holds right now. It's an absolute set,
    not an addition — a lower amount is recorded as a dated "Balance adjustment" so history stays honest.
    To put money INTO an account, record it as income and choose the account — balances can't be raised here.</p>
    ${fieldHtml("Balance on hand", `<input type="text" id="sb-amount" inputmode="numeric">`)}
    ${modalActions("Set balance")}`);
  bindModalClose();
  const inp = attachMoneyInput($("#sb-amount"), cur);
  $("[data-save]", $("#modal-root")).addEventListener("click", async () => {
    const target = inp.getCents();
    const curNow = accountBalance(acctId);
    const diff = target - curNow;
    if (diff === 0) { closeModal(); toast("Balance set"); return; }
    if (diff > 0) {
      // HARD RULE (Matt): the only way to get money into an account is
      // to add an income amount and assign it to an account. A balance
      // increase here is refused and NOTHING is written.
      toast("To add money to an account, record it as income and choose the account");
      return;
    }
    await writeBalanceAdjustment(a, target, curNow, diff);
    closeModal(); toast("Balance set");
  });
}
function openReconcile(acctId) {
  const a = accountById(acctId);
  if (!a) return;
  openModal(`<h2>Reconcile — ${esc(a.name)}</h2>
    <p class="small muted">Marks every transaction in this account on or before the date as cleared,
    and records the account as reconciled through that date.</p>
    ${fieldHtml("Reconciled through", `<input type="date" id="rc-date" value="${todayStr()}">`)}
    ${modalActions("Reconcile")}`);
  bindModalClose();
  $("[data-save]", $("#modal-root")).addEventListener("click", async () => {
    const through = $("#rc-date").value || todayStr();
    const ops = [{ type: "set", coll: "accounts", id: acctId, data: { ...a, reconciledThrough: through } }];
    S.transactions.filter(t => t.accountId === acctId && !t.cleared && t.date <= through)
      .forEach(t => ops.push({ type: "set", coll: "transactions", id: t.id, data: { ...t, cleared: true } }));
    await batchWrite(ops);
    closeModal(); toast("Reconciled through " + through);
  });
}
function openAddAccount() {
  openModal(`<h2>Add account</h2>
    ${fieldHtml("Account name", `<input type="text" id="aa-name" placeholder="e.g. Checking">`)}
    <p class="small muted">Starts at $0.00 — money gets into it by recording income and choosing this account, or by a transfer in.</p>
    ${modalActions("Add account")}`);
  bindModalClose();
  $("[data-save]", $("#modal-root")).addEventListener("click", async () => {
    const name = $("#aa-name").value.trim();
    if (!name) { toast("Name the account"); return; }
    const id = await nextId("accounts");
    const sortOrder = S.accounts.reduce((m, a) => Math.max(m, a.sortOrder), -1) + 1;
    await setDoc("accounts", id, { id, name, openingBalanceCents: 0, reconciledThrough: null, sortOrder, archived: false });
    closeModal(); toast("Account added");
  });
}
function openTransfer() {
  const accts = S.accounts.filter(a => !a.archived);
  if (accts.length < 2) { toast("You need two accounts to transfer"); return; }
  openModal(`<h2>Transfer between accounts</h2>
    ${fieldHtml("From", `<select id="tr-from">${accts.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join("")}</select>`)}
    ${fieldHtml("To", `<select id="tr-to">${accts.map((a, i) => `<option value="${a.id}" ${i === 1 ? "selected" : ""}>${esc(a.name)}</option>`).join("")}</select>`)}
    ${fieldHtml("Amount", `<input type="text" id="tr-amount" inputmode="numeric">`)}
    ${fieldHtml("Date", `<input type="date" id="tr-date" value="${todayStr()}">`)}
    ${modalActions("Transfer")}`);
  bindModalClose();
  const inp = attachMoneyInput($("#tr-amount"), 0);
  $("[data-save]", $("#modal-root")).addEventListener("click", async () => {
    const fromId = Number($("#tr-from").value), toId = Number($("#tr-to").value);
    const cents = inp.getCents(), date = $("#tr-date").value || todayStr();
    if (fromId === toId) { toast("Pick two different accounts"); return; }
    if (cents <= 0) { toast("Enter an amount"); return; }
    const group = "tg-" + Date.now();
    const [id1, id2] = await nextIds("transactions", 2);
    const base = { date, cleared: true, kind: "transfer", transferGroup: group, note: "",
      receiptBlobKey: null, recurringId: null, createdAt: new Date().toISOString() };
    await batchWrite([
      { type: "set", coll: "transactions", id: id1, data: { ...base, id: id1, merchant: "Transfer to " + accountById(toId).name, amountCents: -cents, accountId: fromId } },
      { type: "set", coll: "transactions", id: id2, data: { ...base, id: id2, merchant: "Transfer from " + accountById(fromId).name, amountCents: cents, accountId: toId } },
    ]);
    closeModal(); toast("Transfer recorded");
  });
}

/* ---------------- add item / group ---------------- */
function openAddItem(groupId) {
  const g = groupById(groupId);
  const act = activeMonth();
  openModal(`<h2>Add item to ${esc(g ? g.name : "")}</h2>
    ${fieldHtml("Item name", `<input type="text" id="ai-name" placeholder="e.g. Electric bill">`)}
    ${fieldHtml(`Planned amount for ${monthLabel(act)} (optional)`, `<input type="text" id="ai-planned" inputmode="numeric">`,
      "The item is added to every month; the planned amount applies to this month only — other months start at $0.")}
    ${modalActions("Add item")}`);
  bindModalClose();
  const plannedIn = attachMoneyInput($("#ai-planned"), 0);
  $("[data-save]", $("#modal-root")).addEventListener("click", async () => {
    const name = $("#ai-name").value.trim();
    if (!name) { toast("Name the item"); return; }
    const planned = plannedIn.getCents();
    const itemId = await nextId("items");
    const sortOrder = S.items.filter(i => i.groupId === groupId).reduce((m, i) => Math.max(m, i.sortOrder), -1) + 1;
    const ms = monthsSorted();
    const lineIds = await nextIds("monthLines", ms.length);
    const itemData = {
      id: itemId, groupId, name, sortOrder, favorite: false, openingBalanceCents: 0,
      recurringPlannedCents: null, targetCents: null, dueDay: null, archived: false };
    const ops = [{ type: "set", coll: "items", id: itemId, data: itemData }];
    let actLine = null;
    ms.forEach((m, i) => {
      const lineData = {
        id: lineIds[i], month: m, itemId, groupId, itemName: name,
        groupName: g ? g.name : "", plannedCents: m === act ? planned : 0, sortOrder };
      if (m === act) actLine = lineData;
      ops.push({ type: "set", coll: "monthLines", id: lineIds[i], data: lineData });
    });
    await batchWrite(ops);
    closeModal(); toast("Item added");
    // A brand-new income card given a Planned amount behaves exactly like
    // an edited one: the same shared destination prompt, with the new
    // item passed explicitly (it may not be in S yet — the write just
    // landed and the snapshot round-trip is not guaranteed synchronous).
    const actClosed = !!(S.months[act] && S.months[act].closed);
    if (g && g.isIncome && planned > 0 && actLine && !actClosed) {
      promptIncomeDestination(actLine, planned, itemData);
    }
  });
}
function openAddGroup() {
  openModal(`<h2>Add group</h2>
    ${fieldHtml("Group name", `<input type="text" id="ag-name" placeholder="e.g. Transportation">`)}
    <div class="field"><label><input type="checkbox" id="ag-income" style="width:auto;"> This is an income group</label></div>
    ${modalActions("Add group")}`);
  bindModalClose();
  $("[data-save]", $("#modal-root")).addEventListener("click", async () => {
    const name = $("#ag-name").value.trim();
    if (!name) { toast("Name the group"); return; }
    const id = await nextId("groups");
    const sortOrder = S.groups.reduce((m, g) => Math.max(m, g.sortOrder), -1) + 1;
    await setDoc("groups", id, { id, name, isIncome: $("#ag-income").checked, sortOrder });
    closeModal(); toast("Group added");
  });
}

/* ---------------- month close ---------------- */
function openMonthClose(flows) {
  const m = UI.month;
  const bc = balanceCheck(m, flows);
  const pendingRows = S.statementRows.filter(r => r.status === "pending" && monthOf(r.date) === m).length;
  const uncleared = S.transactions.filter(t => !t.cleared && monthOf(t.date) === m).length;
  const row = (ok, label, detail) => `<div class="checkrow"><span class="st">${ok ? "✅" : "⚠️"}</span>
    <span><b>${esc(label)}</b><br><span class="small muted">${esc(detail)}</span></span></div>`;
  openModal(`<h2>Close ${monthLabel(m)}</h2>
    ${row(bc.difference === 0, "Books balance", bc.difference === 0
      ? "Accounts and budget agree to the penny." : `Difference is ${fmtSigned(bc.difference)} — closing anyway will snapshot it as-is.`)}
    ${row(pendingRows === 0, "Statement rows reviewed", pendingRows === 0 ? "Nothing left pending for this month." : pendingRows + " row(s) still pending in Review.")}
    ${row(uncleared === 0, "Transactions cleared", uncleared === 0 ? "Everything in this month is cleared." : uncleared + " transaction(s) still uncleared (e.g. pending charges).")}
    <p class="small muted">Closing saves a full backup snapshot of the entire budget, then locks this month's planned amounts. You can reopen it later if needed.</p>
    <div class="actions"><button class="btn secondary" data-close>Not yet</button>
      <button class="btn" id="mc-close">Snapshot &amp; close month</button></div>`);
  bindModalClose();
  $("#mc-close").addEventListener("click", async () => {
    const snapId = await nextId("snapshots");
    await db.collection("snapshots").doc(String(snapId)).set({
      id: snapId, month: m, createdAt: new Date().toISOString(),
      createdBy: S.user ? S.user.email : "", kind: "month-close", data: buildBackup() });
    await setDoc("months", m, { ...S.months[m], closed: true });
    closeModal(); toast(monthLabel(m) + " closed");
  });
}

/* ---------------- recurring ---------------- */
function advanceDate(dateStr, frequency) {
  if (frequency === "weekly") return addDays(dateStr, 7);
  const [y, mo, da] = dateStr.split("-").map(Number);
  const nm = addMonths(`${y}-${String(mo).padStart(2, "0")}`, 1);
  const [ny, nmo] = nm.split("-").map(Number);
  const lastDay = new Date(ny, nmo, 0).getDate();
  return `${nm}-${String(Math.min(da, lastDay)).padStart(2, "0")}`;
}
async function postRecurring(rule, throughDate, maxCount) {
  let date = rule.nextDate;
  let count = 0;
  const ops = [];
  while (date && date <= throughDate && count < (maxCount || 240)) {
    const month = monthOf(date);
    if (!S.months[month] && !(await ensureMonth(month, true))) break;
    const line = lineOf(month, rule.itemId);
    if (!line) break;
    const txnId = await nextId("transactions");
    const splitId = await nextId("splits");
    ops.push({ type: "set", coll: "transactions", id: txnId, data: {
      id: txnId, date, merchant: rule.merchant, note: rule.note || "",
      amountCents: rule.amountCents, accountId: rule.accountId, cleared: false,
      kind: "standard", transferGroup: null, receiptBlobKey: null,
      recurringId: rule.id, createdAt: new Date().toISOString() } });
    ops.push({ type: "set", coll: "splits", id: splitId, data: {
      id: splitId, transactionId: txnId, monthLineId: line.id, amountCents: rule.amountCents } });
    date = advanceDate(date, rule.frequency);
    count++;
  }
  if (count) {
    ops.push({ type: "set", coll: "recurring", id: rule.id, data: { ...rule, nextDate: date } });
    await batchWrite(ops);
  }
  return count;
}
async function postAllDue() {
  let total = 0;
  for (const r of S.recurring.filter(r => r.active !== false)) total += await postRecurring(r, todayStr(), 240);
  toast(total ? `Posted ${total} recurring transaction(s)` : "Nothing due right now");
  render();
}

/* ---------------- backup / export ---------------- */
function sortedById(arr) { return arr.slice().sort((a, b) => a.id - b.id); }
function buildBackup() {
  return {
    app: "custom-budget-tool", version: 1, exportedAt: new Date().toISOString(),
    groups: sortedById(S.groups), items: sortedById(S.items),
    months: monthsSorted().map(m => ({ month: m, closed: !!S.months[m].closed, memo: S.months[m].memo || "" })),
    monthLines: sortedById(S.monthLines), accounts: sortedById(S.accounts),
    transactions: sortedById(S.transactions), splits: sortedById(S.splits),
    recurring: sortedById(S.recurring), statementImports: sortedById(S.statementImports),
    statementRows: sortedById(S.statementRows), merchantMappings: sortedById(S.merchantMappings),
    budgetMoves: sortedById(S.budgetMoves),
  };
}
function exportBackup() {
  download(`budget-backup-${todayStr()}.json`, JSON.stringify(buildBackup(), null, 2), "application/json");
  toast("Backup downloaded");
}
/* In-page restore confirmation — deliberately NOT a native dialog:
   automated browsers dismiss those, which silently cancelled the restore.
   Resolves true only when the user taps Import; Cancel or a backdrop
   click resolves false. */
function confirmBackupRestore() {
  return new Promise(resolve => {
    let settled = false;
    const settle = ok => { if (settled) return; settled = true; closeModal(); resolve(ok); };
    openModal(`<h2>Restore this backup?</h2>
      <p>Importing <b>replaces ALL current budget data</b> in the shared budget — every month,
      budget item, account and transaction — with the backup's contents.
      This cannot be undone except by restoring another backup.</p>
      ${modalActions("Import")}`);
    const root = $("#modal-root");
    $("[data-save]", root).addEventListener("click", () => settle(true));
    $$("[data-close]", root).forEach(b => b.addEventListener("click", () => settle(false)));
    $("#modal-bg").addEventListener("click", e => { if (e.target.id === "modal-bg") settle(false); });
    bindModalClose();
  });
}
/* Generic in-page yes/no confirmation, same pattern as confirmBackupRestore():
   resolves true only when the user taps the confirm button; Cancel or a
   backdrop click resolves false. Deliberately NOT a native confirm() dialog. */
function confirmActionModal(title, bodyText, confirmLabel) {
  return new Promise(resolve => {
    let settled = false;
    const settle = ok => { if (settled) return; settled = true; closeModal(); resolve(ok); };
    openModal(`<h2>${esc(title)}</h2>
      <p>${esc(bodyText)}</p>
      ${modalActions(confirmLabel)}`);
    const root = $("#modal-root");
    $("[data-save]", root).addEventListener("click", () => settle(true));
    $$("[data-close]", root).forEach(b => b.addEventListener("click", () => settle(false)));
    $("#modal-bg").addEventListener("click", e => { if (e.target.id === "modal-bg") settle(false); });
    bindModalClose();
  });
}
async function handleBackupFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); }
  catch (e) { toast("That file isn't valid JSON"); return; }
  if (!data || !Array.isArray(data.items) || !Array.isArray(data.monthLines) || !Array.isArray(data.accounts)) {
    toast("That doesn't look like a budget backup"); return;
  }
  if (!(await confirmBackupRestore())) return;
  const ops = [];
  COLLECTIONS.forEach(coll => S[coll].forEach(doc => ops.push({ type: "delete", coll, id: doc.id })));
  Object.keys(S.months).forEach(m => ops.push({ type: "delete", coll: "months", id: m }));
  const counters = {};
  COLLECTIONS.forEach(coll => {
    const rows = Array.isArray(data[coll]) ? data[coll] : [];
    counters[coll] = rows.reduce((mx, r) => Math.max(mx, r.id || 0), 0) + 1;
    rows.forEach(r => ops.push({ type: "set", coll, id: r.id, data: r }));
  });
  (Array.isArray(data.months) ? data.months : []).forEach(mo =>
    ops.push({ type: "set", coll: "months", id: mo.month, data: { month: mo.month, closed: !!mo.closed, memo: mo.memo || "" } }));
  await batchWrite(ops);
  await db.collection("meta").doc("counters").set(counters);
  UI.month = activeMonth();
  toast("Backup restored");
  render();
}
function csvCell(v) {
  v = String(v == null ? "" : v);
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function exportTransactionsCSV() {
  const lines = ["Date,Merchant,Note,Account,Amount,Cleared,Items"];
  S.transactions.slice().sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id).forEach(t => {
    const a = accountById(t.accountId);
    lines.push([t.date, t.merchant, t.note || "", a ? a.name : "", (t.amountCents / 100).toFixed(2),
      t.cleared ? "yes" : "no", txnItemLabel(t)].map(csvCell).join(","));
  });
  download(`transactions-${todayStr()}.csv`, lines.join("\n"), "text/csv");
}
function exportBudgetCSV(flows) {
  const lines = ["Group,Item,Planned,Spent,Remaining,Available"];
  const month = UI.month;
  S.groups.slice().sort((a, b) => a.sortOrder - b.sortOrder).forEach(g => {
    S.monthLines.filter(l => l.month === month && l.groupId === g.id)
      .sort((a, b) => a.sortOrder - b.sortOrder).forEach(l => {
        const f = flows.get(l.id) || 0;
        const spent = isIncomeItem(l.itemId) ? f : -f;
        lines.push([g.name, l.itemName, (l.plannedCents / 100).toFixed(2), (spent / 100).toFixed(2),
          ((l.plannedCents - spent) / 100).toFixed(2), (lineAvailable(l, flows) / 100).toFixed(2)].map(csvCell).join(","));
      });
  });
  download(`budget-${month}.csv`, lines.join("\n"), "text/csv");
}

/* ---------------- auth & boot ---------------- */
function showView(name) {
  $("#view-auth").classList.toggle("hidden", name !== "auth");
  $("#view-denied").classList.toggle("hidden", name !== "denied");
  $("#view-app").classList.toggle("hidden", name !== "app");
}
function initAuth() {
  if (CONFIG_PLACEHOLDER || !auth) {
    showView("auth");
    const n = $("#auth-notice");
    n.textContent = "This copy isn't connected to Firebase yet (placeholder config). Once the real firebase-config.js is in place, sign-in will work here.";
    n.classList.remove("hidden");
    $("#btn-google").disabled = true;
    $("#btn-emaillink").disabled = true;
    return;
  }
  // completing an email-link sign-in?
  if (auth.isSignInWithEmailLink(window.location.href)) {
    let email = window.localStorage.getItem("emailForSignIn");
    if (!email) email = window.prompt("Confirm the email address the link was sent to:");
    if (email) {
      auth.signInWithEmailLink(email, window.location.href)
        .then(() => {
          window.localStorage.removeItem("emailForSignIn");
          window.history.replaceState(null, "", window.location.pathname);
        })
        .catch(err => { $("#auth-msg").textContent = "That sign-in link didn't work: " + err.message; });
    }
  }
  auth.onAuthStateChanged(user => {
    if (user && isAllowed(user.email)) {
      S.user = user;
      showView("app");
      startListeners();
      render();
    } else if (user) {
      S.user = null;
      stopListeners();
      showView("denied");
    } else {
      S.user = null;
      stopListeners();
      showView("auth");
    }
  });
  $("#btn-google").addEventListener("click", () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(err => {
      if (err.code === "auth/popup-blocked" || err.code === "auth/cancelled-popup-request" || err.code === "auth/operation-not-supported-in-this-environment") {
        auth.signInWithRedirect(provider);
      } else {
        $("#auth-msg").textContent = "Google sign-in failed: " + err.message;
      }
    });
  });
  $("#btn-emaillink").addEventListener("click", async () => {
    const email = $("#auth-email").value.trim();
    if (!email) { $("#auth-msg").textContent = "Enter your email first."; return; }
    if (!isAllowed(email)) {
      $("#auth-msg").textContent = "Accounts are by invite only — that email isn't on the invite list.";
      return;
    }
    try {
      await auth.sendSignInLinkToEmail(email, { url: window.location.href.split("#")[0], handleCodeInApp: true });
      window.localStorage.setItem("emailForSignIn", email);
      $("#auth-msg").textContent = "Sign-in link sent — check your email on this device and tap the link.";
    } catch (err) {
      $("#auth-msg").textContent = "Couldn't send the link: " + err.message;
    }
  });
  $("#btn-denied-signout").addEventListener("click", () => auth.signOut());
}
function initChrome() {
  $$("#tabbar button").forEach(b => b.addEventListener("click", () => { UI.tab = b.dataset.tab; render(); window.scrollTo(0, 0); }));
  $("#m-prev").addEventListener("click", () => {
    const ms = monthsSorted();
    const i = ms.indexOf(UI.month);
    if (i > 0) { UI.month = ms[i - 1]; render(); }
  });
  $("#m-next").addEventListener("click", async () => {
    const ms = monthsSorted();
    const i = ms.indexOf(UI.month);
    if (i >= 0 && i < ms.length - 1) { UI.month = ms[i + 1]; render(); }
    else if (i === ms.length - 1) {
      const nm = addMonths(UI.month, 1);
      if (await ensureMonth(nm)) { UI.month = nm; render(); }
    }
  });
  $("#m-select").addEventListener("change", e => { UI.month = e.target.value; render(); });
  $("#fab").addEventListener("click", () => openTxnForm({}));
}
initChrome();
initAuth();
if (!auth) showView("auth");
